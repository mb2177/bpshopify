<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Shopify Research{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#16181d;--muted:#667085;--line:#e4e7ec;--accent:#3b5bdb;--accent-soft:#edf2ff;
--good:#2b8a3e;--good-soft:#ebfbee;--warn:#b35c00;--warn-soft:#fff4e6;--bad:#c92a2a;--bad-soft:#fff5f5;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#101215;--card:#181b20;--text:#e9ecef;--muted:#98a2b3;--line:#2a2f37;
--accent:#748ffc;--accent-soft:#1d2440;--good:#69db7c;--good-soft:#14281a;--warn:#ffa94d;--warn-soft:#2c1f0e;--bad:#ff8787;--bad-soft:#2c1414}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
header.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:10px 16px;overflow-x:auto}
header.top .brand{font-weight:700;margin-right:10px;white-space:nowrap}
header.top nav a{padding:6px 10px;border-radius:8px;color:var(--text);white-space:nowrap}
header.top nav a.on{background:var(--accent-soft);color:var(--accent)}
header.top .sp{flex:1}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:24px;margin:4px 0 12px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.muted{color:var(--muted)}.small{font-size:13px}.nowrap{white-space:nowrap}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:9px;
font:inherit;cursor:pointer;text-decoration:none}.btn:hover{text-decoration:none;border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
input,textarea,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
textarea{min-height:110px;resize:vertical}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.b-good{background:var(--good-soft);color:var(--good)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-muted{background:var(--line);color:var(--muted)}
.score{font-size:40px;font-weight:800;line-height:1}.score small{font-size:16px;color:var(--muted);font-weight:500}
.s-good{color:var(--good)}.s-warn{color:var(--warn)}.s-bad{color:var(--bad)}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 14px}.kv>div:nth-child(odd){color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;position:sticky;top:52px;background:var(--bg);z-index:5;padding-top:6px}
.tabs a{white-space:nowrap;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:14px}
.notice{padding:10px 14px;border-radius:10px;margin-bottom:14px}.n-warn{background:var(--warn-soft);color:var(--warn)}.n-info{background:var(--accent-soft)}
.n-bad{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
details>summary{cursor:pointer;color:var(--accent)}
.idea-row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.idea-row:last-child{border-bottom:0}.idea-row .sc{min-width:58px;font-weight:800;font-size:20px;text-align:center}
.idea-row .t{flex:1;min-width:0}.idea-row .t a{font-weight:600}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.mk{font-weight:600}pre{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:9px;font-size:13px}
@media (max-width:640px){.kv{grid-template-columns:1fr;gap:2px}.kv>div:nth-child(odd){margin-top:10px;font-size:13px}
main{padding:12px 10px 60px}.card{padding:13px}.score{font-size:34px}}
img.thumb{max-width:160px;max-height:160px;border-radius:9px;border:1px solid var(--line)}
</style>
</head>
<body>
{% if user %}
<header class="top"><div class="in">
  <span class="brand">🛍 Research</span>
  <nav class="row" style="gap:2px;flex-wrap:nowrap">
    {% set p = request.url.path %}
    <a href="/today" class="{{ 'on' if p.startswith('/today') }}">Сегодня</a>
    <a href="/ideas" class="{{ 'on' if p.startswith('/ideas') and not p.startswith('/ideas/new') and request.query_params.get('f')!='projects' }}">Идеи</a>
    <a href="/ideas?f=projects" class="{{ 'on' if request.query_params.get('f')=='projects' }}">Проекты</a>
    <a href="/ideas/new" class="{{ 'on' if p.startswith('/ideas/new') }}">＋ Проверить идею</a>
    <a href="/sources" class="{{ 'on' if p.startswith('/sources') }}">Источники</a>
    <a href="/settings" class="{{ 'on' if p.startswith('/settings') }}">Настройки</a>
  </nav>
  <span class="sp"></span><a href="/logout" class="muted small">Выйти</a>
</div></header>
{% endif %}
<main>
{% if FAKE %}<div class="notice n-warn">⚠️ Тестовый режим (FAKE_LLM=1): все исследования — вымышленные ДЕМО-данные.</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
